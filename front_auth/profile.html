<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>profile</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      font-family: 'Noto Sans', sans-serif;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .icon {
      width: 80px;
      height: 80px;
      background-color: #ccc;
      border-radius: 50%;
      position: relative;
      margin-bottom: 10px;
    }

    .icon::after {
      content: ";";
      position: absolute;
      font-size: 60px;
      font-weight: bold;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
    }

    .upload-text {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 20px;
    }

    input[type="text"], input[type="month"], select {
      width: 300px;
      padding: 10px;
      margin: 10px 0;
      border: none;
      background-color: #f5f5f5;
      border-radius: 6px;
    }

    button {
      padding: 10px 30px;
      background-color: #404040;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background-color: #333;
    }
  </style>
</head>
<body>

  <div class="icon"></div>
  <div class="upload-text">프로필 이미지 (선택사항, 현재 미지원)</div>

  <label for="name">이름 입력</label>
  <input type="text" id="name"><br>

  <label for="gender">성별</label>
  <select id="gender">
    <option value="">선택 입력</option>
    <option value="MALE">남성</option>
    <option value="FEMALE">여성</option>
  </select><br>

  <label for="birthMonth">생년월</label>
  <input type="month" id="birthMonth">

  <button id="submitProfileBtn">시작하기</button>

  <script src="js/unified-auth.js"></script>
  <script>
    document.getElementById("submitProfileBtn").addEventListener("click", async () => {
      const name = document.getElementById("name").value.trim();
      const email = getEmailFromQuery();
      const gender = document.getElementById("gender").value;
      const birthMonth = document.getElementById("birthMonth").value;

      if (!name || !email || !gender || !birthMonth) {
        alert("모든 항목을 입력해주세요.");
        return;
      }

      const body = { name, email, gender, birthMonth };

      try {
        const result = await postJSON("/save-profile", body);

        if (result.success) {
          alert("✅ 프로필 등록이 완료되었습니다.");
          window.location.href = "login.html";
        } else {
          alert(result.message || "등록 실패");
        }
      } catch (error) {
        console.error("요청 실패:", error);
        alert("서버 오류가 발생했습니다.");
      }
    });
  </script>

</body>
</html>
