<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>signup</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      font-family: 'Noto Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #ffffff;
    }

    input[type="email"], input[type="password"] {
      width: 300px;
      padding: 10px;
      margin: 10px 0;
      border: none;
      background-color: #f5f5f5;
      border-radius: 6px;
    }

    label {
      align-self: flex-start;
      margin-left: calc(50% - 150px);
      margin-top: 10px;
      font-size: 14px;
    }

    .checkbox-container {
      margin: 20px 0;
    }

    .checkbox-container input {
      margin-right: 8px;
    }

    button {
      padding: 10px 30px;
      background-color: #404040;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background-color: #333;
    }
  </style>
</head>
<body>

  <div style="display: flex; flex-direction: column; width: 300px;">
    <label for="email">이메일 등록</label>
    <input type="email" id="email" name="email" required>

    <label for="password">비밀번호 등록</label>
    <input type="password" id="password" name="password" required>

    <div class="checkbox-container" style="display: flex; align-items: center; margin-top: 10px;">
      <input type="checkbox" id="checkbox" name="checkbox" required>
      <label for="checkbox" style="margin: 0;">약관 동의</label>
    </div>

    <button id="submitBtn">이메일 인증</button>
  </div>

  <script src="js/unified-auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("submitBtn").addEventListener("click", async () => {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const checkbox = document.getElementById("checkbox").checked;

        const available = await checkEmailAvailability(email);
        if (!available) {
          alert("이미 존재하는 이메일입니다.");
          return;
        }

        if (!validatePassword(password)) {
          alert("비밀번호는 영문자와 숫자를 포함하여 8자 이상이어야 합니다.");
          return;
        }

        if (!checkbox) {
          alert("약관 동의가 필요합니다.");
          return;
        }

        goToPage(`check-verification.html?email=${encodeURIComponent(email)}`);
      });
    });
  </script>
</body>
</html>
